<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanata - Game Translator</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #050505; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            margin: 0; 
            padding: 40px 20px; 
        }

        /* Efek animasi putaran warna RGB */
        @keyframes rgb-glow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Kotak luar untuk efek border RGB */
        .card-wrapper {
            position: relative;
            padding: 4px; 
            border-radius: 20px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rgb-glow 20s linear infinite;
            max-width: 650px; /* Diperlebar agar list link muat banyak */
            width: 100%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .card-wrapper::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            z-index: -1;
            filter: blur(20px);
            animation: rgb-glow 20s linear infinite;
            opacity: 0.8;
        }

        .profile-card { 
            position: relative;
            text-align: center; 
            background: #0f0f0f; 
            padding: 40px 30px; 
            border-radius: 16px; 
            height: 100%;
            z-index: 1;
        }

        h1 { 
            margin: 0 0 5px 0; 
            color: #ffffff; 
            font-size: 42px; 
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055;
        }
        
        h2 { 
            margin: 0 0 30px 0; 
            color: #00ffd5; 
            font-size: 16px; 
            font-weight: 600; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            text-shadow: 0 0 5px #00ffd5, 0 0 15px #00ffd5;
        }

        /* Tombol YouTube */
        .youtube-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            background: transparent; 
            color: #ff0000; 
            text-decoration: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 14px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4), inset 0 0 15px rgba(255, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px; /* Jarak dengan list game */
        }

        .youtube-btn:hover { 
            background: #ff0000; 
            color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 0, 0, 1), inset 0 0 15px rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .youtube-btn svg { 
            width: 22px; height: 22px; margin-right: 10px; fill: currentColor; 
        }

        /* ----------------------------------
           BAGIAN LIST LINK (PASTELINK GAYA BARU)
           ---------------------------------- */
        .paste-container {
            text-align: left; /* Teks rata kiri khusus untuk list */
            width: 100%;
        }

        .game-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-title {
            color: #fffb00; /* Warna kuning neon untuk judul game */
            font-size: 18px;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 251, 0, 0.5);
            display: flex;
            align-items: center;
        }
        
        .game-title::before {
            content: '🎮';
            margin-right: 10px;
            font-size: 20px;
        }

        .link-group {
            display: flex;
            flex-wrap: wrap; /* Link akan turun ke bawah jika layar sempit */
            gap: 12px;
        }

        /* Desain tombol link utama (Warna Cyan) */
        .neon-link {
            background: rgba(0, 255, 213, 0.05);
            color: #00ffd5;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #00ffd5;
            box-shadow: 0 0 8px rgba(0, 255, 213, 0.3), inset 0 0 8px rgba(0, 255, 213, 0.1);
            transition: all 0.3s ease;
            text-align: center;
            flex-grow: 1; /* Memanjang menyesuaikan tempat kosong */
        }

        .neon-link:hover {
            background: #00ffd5;
            color: #050505;
            box-shadow: 0 0 15px rgba(0, 255, 213, 0.8);
            transform: translateY(-2px);
        }

        /* Desain tombol link alternatif/kedua (Warna Pink/Magenta) */
        .neon-link.alt {
            color: #ff00c8;
            border-color: #ff00c8;
            background: rgba(255, 0, 200, 0.05);
            box-shadow: 0 0 8px rgba(255, 0, 200, 0.3), inset 0 0 8px rgba(255, 0, 200, 0.1);
        }

        .neon-link.alt:hover {
            background: #ff00c8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 200, 0.8);
        }

    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="profile-card">
            
            <!-- HEADER PROFIL -->
            <h1>Tanata Otto Margadirata</h1>
            <h2>Game Translator</h2>

            <a href="https://www.youtube.com/@tanata_otto_margadirata" target="_blank" class="youtube-btn">
                <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                Kunjungi YouTube
            </a>
            
            <!-- LIST PASTELINK GAME TRANSLATION -->
            <div class="paste-container">
                
                <!-- Kategori Game 1 -->
                <div class="game-section">
                    <h3 class="game-title">Forestia</h3>
                    <div class="link-group">
                        <a href="#" class="neon-link">Link 1 (Google Drive)</a>
                        <a href="#" class="neon-link">Link 2 (Mediafire)</a>
                        <!-- Tambahkan class "alt" untuk warna pink/berbeda -->
                        <a href="#" class="neon-link alt">Patch Only</a> 
                    </div>
                </div>

                <!-- Kategori Game 2 -->
                <div class="game-section">
                    <h3 class="game-title">Nama Game 1 Versi 1.3</h3>
                    <div class="link-group">
                        <a href="#" class="neon-link">Download Full</a>
                        <a href="#" class="neon-link alt">Mirror Link</a>
                    </div>
                </div>

                <!-- Kategori Game 3 -->
                <div class="game-section">
                    <h3 class="game-title">Game Lainnya Versi 2.0</h3>
                    <div class="link-group">
                        <a href="#" class="neon-link">Part 1</a>
                        <a href="#" class="neon-link">Part 2</a>
                        <a href="#" class="neon-link">Part 3</a>
                    </div>
                </div>

            </div>
            
        </div>
    </div>

</body>
</html>
