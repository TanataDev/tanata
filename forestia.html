<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forestia - Game Translator</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #050505; color: #e0e0e0; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 40px 20px; 
        }
        @keyframes rgb-glow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .card-wrapper {
            position: relative; padding: 4px; border-radius: 20px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%; animation: rgb-glow 20s linear infinite; max-width: 650px; width: 100%; box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }
        .card-wrapper::after {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%; z-index: -1; filter: blur(20px); animation: rgb-glow 20s linear infinite; opacity: 0.8;
        }
        .profile-card { position: relative; text-align: center; background: #0f0f0f; padding: 40px 30px; border-radius: 16px; height: 100%; z-index: 1; }
        
        h1 { margin: 0 0 5px 0; color: #ffffff; font-size: 42px; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055; }
        h2 { margin: 0 0 30px 0; color: #00ffd5; font-size: 16px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 5px #00ffd5, 0 0 15px #00ffd5; }

        .back-btn { 
            display: inline-flex; align-items: center; justify-content: center; background: transparent; color: #aaaaaa; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; border: 1px solid #444; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; 
        }
        .back-btn:hover { background: #333; color: #ffffff; transform: translateX(-5px); }
        
        .paste-container { text-align: left; width: 100%; }
        .game-section { background: rgba(255, 255, 255, 0.02); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .game-title { color: #fffb00; font-size: 18px; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 5px rgba(255, 251, 0, 0.5); display: flex; align-items: center; }
        .game-title::before { content: '🔗'; margin-right: 10px; font-size: 18px; }

        .link-group { display: flex; flex-wrap: wrap; gap: 12px; }
        .neon-link { background: rgba(0, 255, 213, 0.05); color: #00ffd5; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; font-size: 14px; border: 1px solid #00ffd5; box-shadow: 0 0 8px rgba(0, 255, 213, 0.3), inset 0 0 8px rgba(0, 255, 213, 0.1); transition: all 0.3s ease; text-align: center; flex-grow: 1; }
        .neon-link:hover { background: #00ffd5; color: #050505; box-shadow: 0 0 15px rgba(0, 255, 213, 0.8); transform: translateY(-2px); }
        .neon-link.alt { color: #ff00c8; border-color: #ff00c8; background: rgba(255, 0, 200, 0.05); box-shadow: 0 0 8px rgba(255, 0, 200, 0.3), inset 0 0 8px rgba(255, 0, 200, 0.1); }
        .neon-link.alt:hover { background: #ff00c8; color: #ffffff; box-shadow: 0 0 15px rgba(255, 0, 200, 0.8); }

    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="profile-card">
            
            <h1>Forestia</h1>
            <h2>Link Download & Patch</h2>

            <a href="index.html" class="back-btn">
                ⬅ Kembali ke Menu Utama
            </a>
            
            <div class="paste-container">
                
                <!-- Kategori Versi 1 -->
                <div class="game-section">
                    <h3 class="game-title">Versi 1.4 + DLC</h3>
                    <div class="link-group">
                        <a href="#" class="neon-link">Link 1 (Google Drive)</a>
                        <a href="#" class="neon-link">Link 2 (Mediafire)</a>
                        <a href="#" class="neon-link alt">Patch Only</a> 
                    </div>
                </div>

                <!-- Kategori Versi 2 -->
                <div class="game-section">
                    <h3 class="game-title">Versi 1.3</h3>
                    <div class="link-group">
                        <a href="#" class="neon-link">Download Full</a>
                        <a href="#" class="neon-link alt">Mirror Link</a>
                    </div>
                </div>

            </div>
            
        </div>
    </div>
</body>
</html>
