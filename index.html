<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanata - Game Translator</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #050505; color: #e0e0e0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; overflow: hidden;
        }
        @keyframes rgb-glow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .card-wrapper {
            position: relative; padding: 4px; border-radius: 20px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%; animation: rgb-glow 20s linear infinite; max-width: 500px; width: 100%; box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }
        .card-wrapper::after {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%; z-index: -1; filter: blur(20px); animation: rgb-glow 20s linear infinite; opacity: 0.8;
        }
        .profile-card { position: relative; text-align: center; background: #0f0f0f; padding: 50px 30px; border-radius: 16px; height: 100%; z-index: 1; }
        h1 { margin: 0 0 35px 0; color: #ffffff; font-size: 32px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055; line-height: 1.3;}
        
        .youtube-btn { 
            display: inline-flex; align-items: center; justify-content: center; background: transparent; color: #ff0000; text-decoration: none; padding: 15px 25px; border-radius: 8px; font-weight: bold; font-size: 16px; width: 100%; border: 2px solid #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.4), inset 0 0 15px rgba(255, 0, 0, 0.2); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
        }
        .youtube-btn:hover { background: #ff0000; color: #ffffff; box-shadow: 0 0 25px rgba(255, 0, 0, 1), inset 0 0 15px rgba(255, 255, 255, 0.5); transform: scale(1.05); }
        .youtube-btn svg { width: 26px; height: 26px; margin-right: 12px; fill: currentColor; }
        
        .menu-btn {
            display: inline-flex; align-items: center; justify-content: center; background: transparent; color: #00ffd5; text-decoration: none; padding: 15px 25px; border-radius: 8px; font-weight: bold; font-size: 16px; width: 100%; border: 2px solid #00ffd5; box-shadow: 0 0 15px rgba(0, 255, 213, 0.4), inset 0 0 15px rgba(0, 255, 213, 0.2); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px;
        }
        .menu-btn:hover { background: #00ffd5; color: #050505; box-shadow: 0 0 25px rgba(0, 255, 213, 1), inset 0 0 15px rgba(255, 255, 255, 0.5); transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="profile-card">
            <h1>Tanata Otto Margadirata</h1>
        </div>
    </div>
</body>
</html>
