<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanata - Game Translator</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }
        .profile-card { 
            max-width: 500px; 
            width: 100%; 
            text-align: center; 
            background: #1e1e1e; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
            border: 1px solid #333;
        }
        img.profile { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 15px; 
            border: 3px solid #ff0000;
        }
        h1 { margin: 0 0 5px 0; color: #ffffff; font-size: 26px; }
        h2 { margin: 0 0 20px 0; color: #aaaaaa; font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        p.bio { color: #cccccc; line-height: 1.6; margin-bottom: 35px; font-size: 15px; }
        
        .youtube-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            background: #ff0000; 
            color: white; 
            text-decoration: none; 
            padding: 15px 25px; 
            border-radius: 8px; 
            font-weight: bold; 
            transition: background 0.3s, transform 0.2s; 
            font-size: 16px;
            width: 100%;
        }
        .youtube-btn:hover { background: #cc0000; transform: translateY(-3px); }
        .youtube-btn svg { width: 24px; height: 24px; margin-right: 10px; fill: currentColor; }

        .stats-box { 
            margin-top: 40px; 
            padding-top: 20px; 
            border-top: 1px dashed #444; 
            font-size: 0.85em; 
            color: #888; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Foto Profil Placeholder (Warna Merah Tema YouTube/Gaming) -->
        <img src="https://ui-avatars.com/api/?name=Tanata&background=ff0000&color=fff&size=200" alt="Tanata" class="profile">
        
        <h1>Tanata</h1>
        <h2>🎮 Game Translator</h2>
        
        <p class="bio">
            Halo! Saya adalah seorang <strong>Penerjemah Game (Game Translator)</strong>. Saya berdedikasi untuk melokalisasi video game agar dapat dinikmati dengan bahasa yang jauh lebih nyaman dan mudah dipahami.
        </p>

        <!-- Tombol YouTube -->
        <a href="https://www.youtube.com/@tanata_otto_margadirata" target="_blank" class="youtube-btn">
            <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
            Kunjungi YouTube Saya
        </a>

        <!-- Bagian Statistik (Tetap dipertahankan) -->
        <div class="stats-box">
            <div><img src="https://visitor-badge.laobi.icu/badge?page_id=tanata.my.id" alt="visitors" style="vertical-align: middle;"></div>
            <div>📡 IP: <span id="ip-address">Loading...</span></div>
        </div>
    </div>

    <script>
        // Fungsi Mengambil IP Pengunjung
        async function fetchIP() {
            try {
                let res = await fetch('https://api.ipify.org?format=json');
                let data = await res.json();
                document.getElementById('ip-address').innerText = data.ip;
            } catch (error) {
                document.getElementById('ip-address').innerText = "Gagal memuat";
            }
        }
        window.onload = () => { fetchIP(); };
    </script>
</body>
</html>
